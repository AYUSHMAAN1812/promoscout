[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promoscout"
version = "0.1.0"
description = "AI-assisted promo discovery for timestamped microdrama screenplays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

